<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room bookings</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  form { display: grid; grid-template-columns: max-content 1fr; gap: 0.5rem 1rem; align-items: center; }
  form button { grid-column: 2; justify-self: start; }
  .filter { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-top: 1.5rem; }
  #booking-list li { display: flex; justify-content: space-between; gap: 1rem; padding: 0.25rem 0; }
  #error { color: #b00020; min-height: 1.5em; }
  button:disabled { opacity: 0.6; }
</style>
</head>
<body>
<h1>Room bookings</h1>
<form id="booking-form" novalidate>
  <label for="room">Room</label>
  <select id="room" name="room"></select>
  <label for="title">Title</label>
  <input type="text" id="title" name="title">
  <label for="date">Date</label>
  <input type="date" id="date" name="date">
  <label for="start">Start</label>
  <input type="time" id="start" name="start">
  <label for="end">End</label>
  <input type="time" id="end" name="end">
  <button type="submit" id="book">Book</button>
</form>
<p id="error" role="alert"></p>
<div class="filter">
  <label for="filter-date">Show date</label>
  <input type="date" id="filter-date">
  <button type="button" id="show-all">Show all</button>
</div>
<ul id="booking-list"></ul>
<script src="/app.js"></script>
</body>
</html>
