<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room bookings</title>
<style>
  :root {
    --ink: #1d2433;
    --muted: #5b6475;
    --line: #d8dde6;
    --paper: #f6f7f9;
    --accent: #2f5bd3;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem 4rem;
    font: 16px/1.5 system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  main { max-width: 42rem; margin: 0 auto; }
  h1 { margin: 0 0 1.5rem; font-size: 1.75rem; letter-spacing: -0.01em; }
  h2 { margin: 2rem 0 0.75rem; font-size: 1.125rem; }
  form, .filter {
    display: grid;
    gap: 0.75rem 1rem;
    padding: 1.25rem;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 0.5rem;
  }
  form { grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); }
  .filter { grid-template-columns: 1fr auto; align-items: end; }
  .field { display: grid; gap: 0.25rem; }
  .field.wide { grid-column: 1 / -1; }
  label { font-size: 0.875rem; font-weight: 600; color: var(--muted); }
  input, select, button { font: inherit; }
  input, select {
    width: 100%;
    padding: 0.4rem 0.5rem;
    border: 1px solid var(--line);
    border-radius: 0.375rem;
    background: #fff;
    color: var(--ink);
  }
  button {
    padding: 0.45rem 1rem;
    border: 1px solid var(--accent);
    border-radius: 0.375rem;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button[type="button"] { background: #fff; color: var(--accent); }
  button:disabled { opacity: 0.55; cursor: progress; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #book { align-self: end; }
  #error { min-height: 1.5em; margin: 1rem 0 0; color: var(--danger); font-weight: 600; }
  #booking-list { list-style: none; margin: 0; padding: 0; }
  #booking-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding: 0.6rem 0.25rem;
    border-bottom: 1px solid var(--line);
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
<main>
  <h1>Room bookings</h1>
  <form id="booking-form" novalidate>
    <div class="field">
      <label for="room">Room</label>
      <select id="room" name="room"></select>
    </div>
    <div class="field wide">
      <label for="title">Title</label>
      <input type="text" id="title" name="title">
    </div>
    <div class="field">
      <label for="date">Date</label>
      <input type="date" id="date" name="date">
    </div>
    <div class="field">
      <label for="start">Start</label>
      <input type="time" id="start" name="start">
    </div>
    <div class="field">
      <label for="end">End</label>
      <input type="time" id="end" name="end">
    </div>
    <button type="submit" id="book">Book</button>
  </form>
  <p id="error" role="alert"></p>
  <h2>Bookings</h2>
  <div class="filter">
    <div class="field">
      <label for="filter-date">Show date</label>
      <input type="date" id="filter-date">
    </div>
    <button type="button" id="show-all">Show all</button>
  </div>
  <ul id="booking-list"></ul>
</main>
<script src="/app.js"></script>
</body>
</html>
