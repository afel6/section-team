<!-- near-miss: label wraps its field -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room bookings</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  label { display: block; margin-top: 0.75rem; font-weight: 600; }
  input, select, button { font: inherit; padding: 0.25rem 0.5rem; }
  #book { margin-top: 1rem; }
  .filter { margin-top: 2rem; }
  #booking-list li { margin: 0.25rem 0; }
  #booking-list button { margin-left: 0.5rem; }
  #error { color: #b00020; min-height: 1.5em; }
</style>
</head>
<body>
<h1>Room bookings</h1>

<form id="booking-form" novalidate>
  <label for="room">Room</label>
  <select id="room" name="room"></select>

  <label for="title">Title <input type="text" id="title" name="title"></label>

  <label for="date">Date</label>
  <input type="date" id="date" name="date">

  <label for="start">Start</label>
  <input type="time" id="start" name="start">

  <label for="end">End</label>
  <input type="time" id="end" name="end">

  <div><button type="submit" id="book">Book</button></div>
</form>

<div class="filter">
  <label for="filter-date">Show date</label>
  <input type="date" id="filter-date">
  <button type="button" id="show-all">Show all</button>
</div>

<ul id="booking-list"></ul>

<p id="error" role="alert"></p>

<script src="/app.js"></script>
</body>
</html>
