<!-- near-miss: Title label wraps its input -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room bookings</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  form, .filter { display: grid; grid-template-columns: max-content 1fr; gap: 0.5rem 1rem; align-items: center; margin-bottom: 1.5rem; }
  form button { grid-column: 2; justify-self: start; }
  .filter button { grid-column: 2; justify-self: start; }
  input, select, button { font: inherit; padding: 0.25rem 0.5rem; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #booking-list { padding-left: 1.25rem; }
  #booking-list li { margin-bottom: 0.5rem; }
  #booking-list button { margin-left: 0.75rem; }
  #error { color: #b00020; min-height: 1.5em; }
</style>
</head>
<body>
<h1>Room bookings</h1>
<form id="booking-form" novalidate>
  <label for="room">Room</label>
  <select id="room" name="room"></select>
  <label for="title">Title<input type="text" id="title" name="title"></label>
  <label for="date">Date</label>
  <input type="date" id="date" name="date">
  <label for="start">Start</label>
  <input type="time" id="start" name="start">
  <label for="end">End</label>
  <input type="time" id="end" name="end">
  <button type="submit" id="book">Book</button>
</form>
<div class="filter">
  <label for="filter-date">Show date</label>
  <input type="date" id="filter-date">
  <button type="button" id="show-all">Show all</button>
</div>
<p id="error" role="alert"></p>
<ul id="booking-list"></ul>
<script src="/app.js"></script>
</body>
</html>
