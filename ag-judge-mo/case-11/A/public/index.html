<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room bookings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #1d1d1f; }
    h1 { font-size: 1.6rem; }
    form, .filter { display: grid; grid-template-columns: max-content 1fr; gap: 0.5rem 1rem; align-items: center; margin-bottom: 1.5rem; }
    form button { grid-column: 2; justify-self: start; }
    button { padding: 0.35rem 0.9rem; cursor: pointer; }
    button:disabled { cursor: progress; opacity: 0.6; }
    #error { color: #b00020; min-height: 1.2em; }
    #booking-list { padding-left: 1.2rem; }
    #booking-list li { margin: 0.35rem 0; }
    #booking-list button { margin-left: 0.6rem; }
  </style>
</head>
<body>
  <h1>Room bookings</h1>
  <form id="booking-form" novalidate>
    <label for="room">Room</label>
    <select id="room" name="room"></select>
    <label for="title">Title</label>
    <input type="text" id="title" name="title">
    <label for="date">Date</label>
    <input type="date" id="date" name="date">
    <label for="start">Start</label>
    <input type="time" id="start" name="start">
    <label for="end">End</label>
    <input type="time" id="end" name="end">
    <button type="submit" id="book">Book</button>
  </form>
  <div class="filter">
    <label for="filter-date">Show date</label>
    <input type="date" id="filter-date">
    <button type="button" id="show-all">Show all</button>
  </div>
  <p id="error" role="alert"></p>
  <ul id="booking-list"></ul>
  <script src="/app.js"></script>
</body>
</html>
