<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room bookings</title>
<style>
  :root { color-scheme: light dark; --accent: #2f6fdf; --muted: #6b7280; --danger: #c0392b; }
  * { box-sizing: border-box; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.75rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2rem 0 0.75rem; }
  form { display: grid; grid-template-columns: max-content 1fr; gap: 0.6rem 1rem; align-items: center; }
  label { font-weight: 600; }
  input, select, button { font: inherit; padding: 0.4rem 0.6rem; border: 1px solid var(--muted); border-radius: 6px; }
  button { cursor: pointer; background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: 0.55; cursor: progress; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #book { grid-column: 2; justify-self: start; }
  .filter { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
  #show-all { background: transparent; color: var(--accent); }
  #booking-list { list-style: none; padding: 0; margin: 1rem 0 0; }
  #booking-list li { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.5rem 0; border-bottom: 1px solid color-mix(in srgb, var(--muted) 35%, transparent); }
  #booking-list li button { background: transparent; color: var(--danger); border-color: var(--danger); padding: 0.2rem 0.6rem; }
  #error { color: var(--danger); font-weight: 600; min-height: 1.5em; }
</style>
</head>
<body>
<main>
<h1>Room bookings</h1>
<form id="booking-form" novalidate>
  <label for="room">Room</label>
  <select id="room" name="room"></select>
  <label for="title">Title</label>
  <input type="text" id="title" name="title" autocomplete="off">
  <label for="date">Date</label>
  <input type="date" id="date" name="date">
  <label for="start">Start</label>
  <input type="time" id="start" name="start">
  <label for="end">End</label>
  <input type="time" id="end" name="end">
  <button type="submit" id="book">Book</button>
</form>
<p id="error" role="alert"></p>
<h2>Bookings</h2>
<div class="filter">
  <label for="filter-date">Show date</label>
  <input type="date" id="filter-date">
  <button type="button" id="show-all">Show all</button>
</div>
<ul id="booking-list"></ul>
</main>
<script src="/app.js"></script>
</body>
</html>
